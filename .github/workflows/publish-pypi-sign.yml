name: Publish htl-sign to PyPI

on:
  push:
    tags:
      - 'pypi-sign-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python/htl_sign
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/htl_sign/dist/
