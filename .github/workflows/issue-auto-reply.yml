name: Issue auto-reply (maintainer away)

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-reply
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thanks for opening this.",
              "",
              "The maintainer is off-grid until around 2026-10-20 for personal reasons. The service remains in autonomous mode, with monitoring active and all endpoints kept online.",
              "",
              "I will triage this issue when I return. For anything that cannot wait, you can run your own instance using docs/self-host.md.",
              "",
              "For outage reports, docs/status.json contains the latest external heartbeat."
            ].join("\\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
