[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "htl-sign"
version = "1.0.0"
description = "Generate X-Trust signed human-presence HTTP headers. Standard library only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["trust", "human-proof", "anti-bot", "x-trust", "llm", "ai-infrastructure"]

[project.urls]
Homepage = "https://htl-syterme.github.io/htl-core"
Repository = "https://github.com/htl-syterme/htl-core"
Spec = "https://github.com/htl-syterme/htl-core/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["htl_sign"]
